name = "kedster-portfolio-worker"
main = "src/index.js"
compatibility_date = "2024-09-17"

# Worker configuration
workers_dev = true

# Environment variables can be set here
# [env.production]
# name = "kedster-portfolio-worker-prod"

# KV namespaces (for future use)
# [[kv_namespaces]]
# binding = "PORTFOLIO_KV"
# id = "your-kv-namespace-id"

# D1 database bindings (for future use)
# [[d1_databases]]
# binding = "PORTFOLIO_DB"
# database_name = "portfolio"
# database_id = "your-database-id"

# R2 bucket bindings (for future use)
# [[r2_buckets]]
# binding = "PORTFOLIO_BUCKET"
# bucket_name = "portfolio-assets"

# Custom domains (to be configured after deployment)
# routes = [
#   { pattern = "api.sethkeddy.com/*", zone_name = "sethkeddy.com" }
# ]